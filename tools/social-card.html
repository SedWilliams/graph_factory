<!doctype html>
<!--
  Source for docs/assets/social-card.png — the 1280x640 image GitHub shows when the
  repo is linked from Twitter, Slack, or anywhere else that unfurls a URL.
  Rendered by tools/capture-assets.mjs. Colours are the app's own palette.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --deep: #0d0d12;
        --base: #16161d;
        --raised: #1f1f28;
        --border: #3e3e52;
        --text: #f5f2e9;
        --muted: #8a8a9e;
        --accent: #8eaeea;
        --success: #a4ca77;
        --warning: #f0ce8e;
        --purple: #b18cf0;
        --font-sans: Inter, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --font-mono: ui-monospace, 'SFMono-Regular', Consolas, monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1280px;
        height: 640px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 76px;
        background:
          radial-gradient(1100px 520px at 78% 8%, rgba(142, 174, 234, 0.16), transparent 62%),
          radial-gradient(760px 420px at 6% 96%, rgba(177, 140, 240, 0.12), transparent 60%), var(--deep);
        color: var(--text);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }

      .eyebrow {
        font-family: var(--font-mono);
        font-size: 19px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--accent);
      }

      h1 {
        margin-top: 20px;
        font-size: 88px;
        line-height: 1.02;
        letter-spacing: -0.035em;
        font-weight: 700;
      }

      p.tagline {
        margin-top: 24px;
        font-size: 33px;
        line-height: 1.34;
        color: var(--muted);
        max-width: 27ch;
      }

      p.tagline b {
        color: var(--text);
        font-weight: 600;
      }

      /* The pipeline strip: the product's own vocabulary, drawn the way the editor draws it. */
      .pipeline {
        display: flex;
        align-items: center;
        gap: 13px;
        margin-top: 40px;
      }

      .chip {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 11px 17px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--raised);
        font-family: var(--font-mono);
        font-size: 17px;
        color: var(--text);
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
      }

      .arrow {
        width: 26px;
        height: 2px;
        background: var(--border);
        position: relative;
      }

      .arrow::after {
        content: '';
        position: absolute;
        right: -1px;
        top: -3px;
        border-left: 7px solid var(--border);
        border-top: 4px solid transparent;
        border-bottom: 4px solid transparent;
      }

      .arrow.loop {
        background: var(--purple);
      }

      .arrow.loop::after {
        border-left-color: var(--purple);
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid var(--border);
        padding-top: 26px;
      }

      .targets {
        display: flex;
        gap: 30px;
        font-family: var(--font-mono);
        font-size: 21px;
        color: var(--muted);
      }

      .targets b {
        color: var(--text);
        font-weight: 500;
      }

      .repo {
        font-family: var(--font-mono);
        font-size: 21px;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div>
      <div class="eyebrow">Agent systems as graphs</div>
      <h1>Graph Factory</h1>
      <p class="tagline">Draw the pipeline. Get config your harness <b>actually runs</b>.</p>

      <div class="pipeline">
        <div class="chip"><i class="dot" style="background: var(--success)"></i>start</div>
        <div class="arrow"></div>
        <div class="chip"><i class="dot" style="background: var(--accent)"></i>builder</div>
        <div class="arrow"></div>
        <div class="chip"><i class="dot" style="background: var(--accent)"></i>reviewer</div>
        <div class="arrow"></div>
        <div class="chip"><i class="dot" style="background: var(--purple)"></i>verdict</div>
        <div class="arrow loop"></div>
        <div class="chip"><i class="dot" style="background: var(--warning)"></i>ship</div>
      </div>
    </div>

    <footer>
      <div class="targets">
        <span><b>Claude Code</b></span>
        <span><b>Pi</b></span>
        <span><b>opencode</b></span>
        <span><b>Codex</b></span>
      </div>
      <div class="repo">github.com/SedWilliams/graph_factory</div>
    </footer>
  </body>
</html>
